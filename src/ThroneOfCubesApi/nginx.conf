events {}

http {
    map $http_origin $cors_origin {
        default "";
        "~^https?://(localhost|127\.0\.0\.1)(:\d+)?$" $http_origin;
        "~^https?://.*\.gorser\.mooo\.com$"          $http_origin;
    }

    map "" $cors_methods { default "GET, POST, PUT, PATCH, DELETE, OPTIONS"; }
    map "" $cors_headers { default "Authorization, Content-Type, X-Requested-With"; }

    upstream account_service {
        server accountmicroservice:8080;
    }

    upstream lobby_service {
        server lobbymicroservice:8080;
    }

    server {
        listen 80;
        
        location = / {
            if ($cors_origin = "") { return 403; }
            add_header Access-Control-Allow-Origin      $cors_origin always;
            add_header Access-Control-Allow-Methods     $cors_methods always;
            add_header Access-Control-Allow-Headers     $cors_headers always;
            add_header Access-Control-Allow-Credentials true        always;
            add_header Vary                             "Origin"    always;
            add_header Content-Length 0;
            add_header Content-Type   text/plain;
            return 204;
        }
        
        location /api/account-service/ {
            if ($request_method = OPTIONS) { return 204; }
        
            add_header Access-Control-Allow-Origin      $cors_origin always;
            add_header Access-Control-Allow-Headers     $cors_headers always;
            add_header Access-Control-Allow-Methods     $cors_methods always;
            add_header Access-Control-Allow-Credentials true        always;
            add_header Vary                             "Origin"    always;
        
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        
            proxy_pass http://account_service/;
        }
        
        location /api/lobby-service/ {
            if ($request_method = OPTIONS) { return 204; }
        
            add_header Access-Control-Allow-Origin      $cors_origin always;
            add_header Access-Control-Allow-Headers     $cors_headers always;
            add_header Access-Control-Allow-Methods     $cors_methods always;
            add_header Access-Control-Allow-Credentials true        always;
            add_header Vary                             "Origin"    always;
        
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        
            proxy_pass http://lobby_service/;
        }
    }
}
